name: CI/CD Pipeline - AI service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Chạy kiểm thử tự động
  test:
    name: Run automated test (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt các gói phụ thuộc
        run: npm ci

      - name: Chạy kiểm thử với Vitest
        run: npm run test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

# Triển khai lên vps, chỉ chạy khi test thành công.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Kết nối SSH và cập nhật container trên VPS
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ secrets.VPS_PROJECT_PATH }}" exit 1
            # In đường dẫn hiện tại để kiểm tra 
            pwd
            git pull origin main
            docker compose up -d --build
            docker image prune -f
